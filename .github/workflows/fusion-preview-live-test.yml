name: Fusion preview live smoke

on:
  push:
    branches:
      - feature/fusion-four-borough-board
    paths:
      - 'fusion/live-preview.test.mjs'
      - '.github/workflows/fusion-preview-live-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MCE_PREVIEW_URL: https://music-city-estates-api-git-f-5312dd-willwill3515-5514s-projects.vercel.app/fusion_board.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether invited players can access the preview
        shell: bash
        run: |
          status=$(curl --location --retry 3 --retry-delay 4 --retry-all-errors --max-time 25 -sS -o /tmp/fusion-preview.html -w '%{http_code}' "$MCE_PREVIEW_URL")
          echo "Live preview HTTP status: $status"
          if [ "$status" = "200" ] && grep -q 'fusion-app.js' /tmp/fusion-preview.html; then
            echo "PASS: Public preview serves the game; testing the deployed page."
            echo "MCE_TEST_MODE=public-preview" >> "$GITHUB_ENV"
          elif grep -qi '<title>Login.*Vercel' /tmp/fusion-preview.html; then
            echo "::warning::Vercel preview is protected by login. Visitors cannot join until sharing is configured. Browser gameplay test will use a local server."
            echo "MCE_PREVIEW_URL=http://127.0.0.1:8000/fusion_board.html" >> "$GITHUB_ENV"
            echo "MCE_TEST_MODE=local-fallback" >> "$GITHUB_ENV"
          else
            echo "Preview HTML title: $(grep -oi '<title>[^<]*' /tmp/fusion-preview.html | head -1 | cut -c1-150)"
            echo "::error::Preview is neither a public Fusion Board nor a recognized login page."
            exit 1
          fi
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local playtest server if Vercel preview is protected
        if: env.MCE_TEST_MODE == 'local-fallback'
        shell: bash
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/mce-local-server.log 2>&1 &
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8000/fusion_board.html -o /tmp/fusion-local.html; then break; fi
            sleep 1
          done
          grep -q 'fusion-app.js' /tmp/fusion-local.html
          echo "Local server ready; PeerJS signalling will still use the public online service."
      - name: Test two mobile browsers, chat and producer exchange
        run: node fusion/live-preview.test.mjs
      - name: Save the approved board's mobile visual test image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-board-mobile-success
          path: fusion-art-board-mobile.png
          if-no-files-found: error
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-preview-failure-screenshots
          path: fusion-live-*.png
          if-no-files-found: ignore
