<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Community Space | D-A Warehouse</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050303;color:#fff;font-family:Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:20;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;pointer-events:none}.plate{background:#090705e8;border:1px solid #ffc34d;border-radius:9px;padding:9px 13px;box-shadow:0 0 20px #ff9d2755}.stats{display:flex;gap:13px}.zone{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:10px;background:#cf7b1a;color:#fff;font-size:9px;font-weight:900;letter-spacing:.08em}.interact{display:none;position:fixed;z-index:30;left:50%;bottom:76px;transform:translateX(-50%);padding:13px 20px;border:1px solid #ffc34d;border-radius:10px;background:#080604ef;font-weight:900;color:#fff;cursor:pointer}.interact.show{display:block}.back{position:fixed;z-index:25;left:15px;bottom:15px;padding:9px 13px;background:#09070ce8;border:1px solid #777;border-radius:7px;color:#fff;text-decoration:none}.hint{position:fixed;z-index:20;left:50%;bottom:20px;transform:translateX(-50%);font-size:11px;background:#0009;padding:7px 12px;border-radius:18px}.touch{display:none;position:fixed;z-index:26;right:15px;bottom:15px;grid-template:repeat(2,44px)/repeat(3,44px);gap:4px}.touch button{border:1px solid #ffffff66;background:#000a;color:#fff;border-radius:9px;font-size:18px}.touch .up{grid-column:2}.touch .left{grid-row:2;grid-column:1}.touch .down{grid-row:2;grid-column:2}.touch .right{grid-row:2;grid-column:3}.modal{display:none;position:fixed;z-index:100;inset:0;background:#000c;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.panel{width:min(610px,96%);background:#100b07;border:1px solid #ffc34d;border-radius:16px;padding:22px;box-shadow:0 0 50px #ff9d2744}.eyebrow{color:#ffc34d;font-size:11px;font-weight:900;letter-spacing:.14em}.panel h2{margin:7px 0 10px}.panel p{color:#ddd;line-height:1.5;min-height:46px}.profile{display:flex;gap:12px;align-items:center;padding:12px;background:#ffffff0b;border:1px solid #ffffff1b;border-radius:10px}.avatar-dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff315b,#7b2cff);font-size:25px}.action,.close{width:100%;padding:13px;border:0;border-radius:8px;font-weight:900;cursor:pointer;margin-top:11px}.action{background:#ffc34d;color:#1b0e00}.action:disabled{opacity:.45;cursor:not-allowed}.close{background:#2b2520;color:#fff}.notice{color:#77ffac!important;min-height:18px!important;font-weight:bold}@media(max-width:720px){.hint{display:none}.touch{display:grid}.stats{font-size:10px;gap:6px}.hud{font-size:12px}.panel{padding:17px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<div class="hud"><div class="plate"><strong>D-A WAREHOUSE</strong><br><small>3D Community Space</small><br><span class="zone">NETWORK • COLLABORATE • BUILD</span></div><div class="plate stats"><span>👥 <b id="fans">0</b></span><span>💵 $<b id="cash">0</b></span><span>⭐ <b id="xp">0</b></span></div></div>
<button class="interact" id="interactPrompt">E / TAP — INTERACT</button>
<a class="back" href="warehouse.html">← Warehouse</a>
<div class="hint">WASD to walk • Drag to look • E to interact</div>
<div class="touch"><button class="up" data-move="w">▲</button><button class="left" data-move="a">◀</button><button class="down" data-move="s">▼</button><button class="right" data-move="d">▶</button></div>

<div class="modal" id="communityPanel"><div class="panel"><div class="eyebrow" id="panelType">COMMUNITY CONNECTION</div><h2 id="panelTitle">Meet the Community</h2><div class="profile"><div class="avatar-dot" id="panelIcon">🤝</div><div><strong id="profileName">D-A Warehouse</strong><br><small id="profileRole">Artists helping artists</small></div></div><p id="panelText"></p><p class="notice" id="panelNotice"></p><button class="action" id="panelAction">CONNECT</button><button class="close" id="closePanel">RETURN TO 3D ROOM</button></div></div>

<script src="player-state.js"></script>
<script src="music_city_catalog.js"></script><script src="music_city_radio_player.js"></script>
<script type="module" src="community_room_3d.js"></script>
</body>
</html>
