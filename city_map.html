<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Full-screen interactive Music City Estates district map.">
<title>Music City Estates | City Map</title>
<style>
:root{--cyan:#62e4ff;--ink:#020711;--panel:#06111fd9;--line:#49cfff66;--text:#f7fbff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,a{font:inherit}
button{color:inherit}
.city-shell{position:fixed;inset:0;background:#020711;overflow:hidden}
.map-stage{position:absolute;inset:0;background-image:linear-gradient(rgba(0,10,26,.04),rgba(0,10,26,.04)),url("music_city_map.jpg");background-size:cover;background-position:center;background-repeat:no-repeat}
.map-stage:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 44px 8px rgba(0,0,0,.62)}
.map-instruction{position:absolute;z-index:40;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid rgba(98,228,255,.35);border-radius:999px;background:rgba(2,8,18,.48);backdrop-filter:blur(10px);box-shadow:0 5px 18px rgba(0,0,0,.35);font-size:10px;font-weight:900;letter-spacing:.12em;pointer-events:none}
.map-instruction i{width:7px;height:7px;border-radius:50%;background:rgba(98,228,255,.85);box-shadow:0 0 8px rgba(98,228,255,.8)}
.hotspot{position:absolute;z-index:20;border:1px solid transparent;border-radius:24px;background:transparent;cursor:pointer;transition:.16s;min-width:34px;min-height:34px;padding:0}
.hotspot:before{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);border:1px solid rgba(128,235,255,.65);border-radius:50%;background:rgba(12,67,105,.18);box-shadow:0 0 7px rgba(64,214,255,.34)}
.hotspot:after{content:attr(data-label);position:absolute;left:50%;top:calc(50% + 12px);transform:translateX(-50%);padding:2px 5px;border-radius:5px;background:rgba(0,5,14,.25);color:rgba(255,255,255,.98);font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:clamp(11px,1.15vw,17px);font-weight:900;letter-spacing:.035em;line-height:1;text-shadow:0 2px 4px #000,0 0 7px #000,0 0 12px #000;white-space:nowrap;pointer-events:none}
.hotspot:hover,.hotspot:focus-visible{outline:none;background:rgba(46,204,255,.03);border-color:rgba(98,228,255,.14)}
.hotspot:hover:before,.hotspot:focus-visible:before{background:rgba(20,110,160,.30);border-color:rgba(158,243,255,.95);box-shadow:0 0 11px rgba(98,228,255,.72)}
.bedroom{left:17%;top:58%;width:13%;height:18%}
.hiphop{left:17%;top:35%;width:16%;height:18%}
.country{left:21%;top:12%;width:19%;height:20%}
.rnb{left:43%;top:12%;width:18%;height:20%}
.downtown{left:42%;top:38%;width:17%;height:20%}
.global{left:64%;top:24%;width:17%;height:21%}
.latin{left:55%;top:54%;width:18%;height:20%}
.sync{left:75%;top:58%;width:15%;height:20%}
.menu-wrap{position:absolute;z-index:60;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.menu-toggle{min-width:44px;height:38px;padding:0 11px;border:1px solid rgba(98,228,255,.42);border-radius:999px;background:rgba(2,8,18,.54);backdrop-filter:blur(10px);font-size:9px;font-weight:900;letter-spacing:.10em;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.35)}
.menu-toggle:hover,.menu-toggle:focus-visible{outline:none;border-color:var(--cyan);background:rgba(6,24,40,.78)}
.quick-menu{display:none;width:min(190px,calc(100vw - 20px));padding:7px;border:1px solid rgba(98,228,255,.30);border-radius:12px;background:rgba(2,8,18,.82);backdrop-filter:blur(14px);box-shadow:0 14px 34px rgba(0,0,0,.62)}
.quick-menu.open{display:grid;gap:5px}
.quick-menu a{min-height:35px;display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid rgba(68,120,160,.32);border-radius:8px;background:rgba(9,23,38,.68);color:#fff;text-decoration:none;font-size:9px;font-weight:900;letter-spacing:.04em}
.quick-menu a:hover,.quick-menu a:focus-visible{outline:none;border-color:rgba(98,228,255,.72);background:rgba(13,43,67,.82)}
.quick-menu .icon{width:18px;text-align:center;font-size:14px}
.toast{display:none;position:absolute;z-index:70;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(330px,calc(100vw - 28px));padding:10px 13px;border:1px solid rgba(98,228,255,.58);border-radius:10px;background:rgba(2,8,18,.86);backdrop-filter:blur(12px);box-shadow:0 12px 30px rgba(0,0,0,.62);text-align:center;font-size:11px;font-weight:800;letter-spacing:.03em}
.toast.show{display:block}
@media(max-width:820px){
  .map-stage{background-position:center}
  .hotspot:after{font-size:10px;letter-spacing:.02em;padding:2px 4px;top:calc(50% + 11px)}
  .hotspot:before{width:10px;height:10px}
  .map-instruction{font-size:8px;padding:6px 8px;letter-spacing:.09em}
  .menu-toggle{height:34px;font-size:8px}
}
@media(max-width:520px){
  .hotspot:after{font-size:8px;padding:1px 3px;background:rgba(0,5,14,.18)}
  .hotspot:before{width:8px;height:8px}
  .map-instruction{left:6px;top:max(6px,env(safe-area-inset-top))}
  .menu-wrap{right:6px;top:max(6px,env(safe-area-inset-top))}
  .menu-toggle{min-width:38px;height:31px;padding:0 8px}
  .quick-menu{width:168px}
}
</style>
</head>
<body>
<main class="city-shell">
  <div class="map-stage" id="mapStage">
    <div class="map-instruction"><i></i>TAP A DISTRICT</div>

    <button class="hotspot bedroom" aria-label="Bedroom Studio" data-label="BEDROOM STUDIO" data-location="bedroom"></button>
    <button class="hotspot hiphop" aria-label="Hip-Hop Heights" data-label="HIP-HOP HEIGHTS" data-location="hiphop"></button>
    <button class="hotspot country" aria-label="Country Crossings" data-label="COUNTRY CROSSINGS" data-location="country"></button>
    <button class="hotspot rnb" aria-label="Velvet Grove" data-label="VELVET GROVE" data-location="rnb"></button>
    <button class="hotspot downtown" aria-label="Downtown Radio" data-label="DOWNTOWN RADIO" data-location="downtown"></button>
    <button class="hotspot global" aria-label="Global Sound" data-label="GLOBAL SOUND" data-location="global"></button>
    <button class="hotspot latin" aria-label="Latin Quarter" data-label="LATIN QUARTER" data-location="latin"></button>
    <button class="hotspot sync" aria-label="Sync Cinema" data-label="SYNC CINEMA" data-location="sync"></button>
  </div>

  <div class="menu-wrap">
    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="quickMenu">MENU</button>
    <nav class="quick-menu" id="quickMenu" aria-label="Quick access">
      <a href="index.html"><span class="icon">⌂</span><span>MAIN MENU</span></a>
      <a href="record_music.html"><span class="icon">🎤</span><span>RECORD MUSIC</span></a>
      <a href="music_city_radio.html"><span class="icon">📻</span><span>CITY RADIO</span></a>
      <a href="social_hub.html"><span class="icon">🌐</span><span>SOCIAL WORLD</span></a>
      <a href="artist_catalog.html"><span class="icon">💿</span><span>ARTIST CATALOG</span></a>
      <a href="avatar_studio.html"><span class="icon">🧍</span><span>CREATE / EDIT ARTIST</span></a>
    </nav>
  </div>

  <div class="toast" id="toast" role="status"></div>
</main>
<script>
(function(){
  const locations={
    bedroom:{name:'Bedroom Studio',page:'bedroom_studio.html'},
    hiphop:{name:'Hip-Hop Heights',page:'hip_hop_heights.html'},
    country:{name:'Country Crossings',page:null},
    rnb:{name:'Velvet Grove',page:null},
    downtown:{name:'Downtown Radio',page:'music_city_radio.html'},
    global:{name:'Global Sound',page:null},
    latin:{name:'Latin Quarter',page:null},
    sync:{name:'Sync Cinema',page:'sync_cinema.html'}
  };
  const toast=document.getElementById('toast');
  let toastTimer=null;
  function showToast(message){
    toast.textContent=message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);
  }
  document.querySelectorAll('[data-location]').forEach((spot)=>{
    spot.addEventListener('click',()=>{
      const location=locations[spot.dataset.location];
      if(location&&location.page){window.location.href=location.page;return;}
      showToast((location?location.name:'This district')+' — COMING SOON');
    });
  });
  const toggle=document.getElementById('menuToggle');
  const menu=document.getElementById('quickMenu');
  toggle.addEventListener('click',(event)=>{
    event.stopPropagation();
    const open=menu.classList.toggle('open');
    toggle.setAttribute('aria-expanded',String(open));
    toggle.textContent=open?'CLOSE':'MENU';
  });
  menu.addEventListener('click',(event)=>event.stopPropagation());
  document.addEventListener('click',()=>{
    if(!menu.classList.contains('open'))return;
    menu.classList.remove('open');
    toggle.setAttribute('aria-expanded','false');
    toggle.textContent='MENU';
  });
})();
</script>
<script src="music_city_soundtrack_catalog.js?v=organ-donor-global-1"></script>
<script src="music_city_soundtrack.js?v=organ-donor-global-1"></script>
</body>
</html>
