<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Catalog | Music City Estates</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17213a,#05070d 62%);color:#fff;font-family:Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:#05070de8;border-bottom:1px solid #22d3ee;position:sticky;top:0;z-index:5;gap:10px}
header h1{font-size:19px;margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.back{color:#fff;text-decoration:none;border:1px solid #22d3ee;border-radius:9px;padding:9px 13px;background:#08111d}
.wrap{width:min(1050px,94%);margin:26px auto 50px}
.hero{padding:22px;border:1px solid #22d3ee55;border-radius:18px;background:#09101dcc;box-shadow:0 0 25px #22d3ee18}
.hero h2{margin:0 0 8px;color:#22d3ee}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{padding:8px 11px;border-radius:18px;background:#111827;border:1px solid #334155}
.notice{margin-top:14px;padding:11px 13px;border-radius:11px;background:#081a23;border:1px solid #164e63;color:#b9efff;display:none}
#catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:18px}
.card{padding:18px;border:1px solid #30384c;border-radius:16px;background:#0b111cee;box-shadow:0 8px 24px #0005}
.card h3{margin:0 0 7px}
.meta{font-size:13px;color:#a8b3ca;line-height:1.55;min-height:20px}
audio{width:100%;margin-top:13px}
.empty{padding:28px;text-align:center;border:1px dashed #3b455f;border-radius:16px;color:#a8b3ca;margin-top:18px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-block;padding:5px 8px;border-radius:10px;background:#0d2d36;color:#7be8ff;font-size:11px;font-weight:bold}
.badge.live{background:#16311f;color:#8ff0aa}
.badge.radio{background:#2c2040;color:#d6b7ff}
.badge.craft{background:#241b3d;color:#c4b5fd}
.badge.certified{background:#3a2b08;color:#fde68a;border:1px solid #a16207}
.craft-summary{margin-top:12px;padding:11px;border:1px solid #3b3158;border-radius:10px;background:#0c0a16;font-size:12px;color:#c8c1d6;line-height:1.5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
button{padding:11px 10px;border:1px solid #22d3ee;border-radius:9px;background:#122033;color:#fff;font-weight:bold;cursor:pointer}
button.primary{background:#22d3ee;color:#041019}
button:disabled{opacity:.45;cursor:not-allowed}
.reward{font-size:12px;color:#96a3bb;margin-top:10px}
.growth{margin-top:13px;padding:12px;border:1px solid #2f5b6f;border-radius:12px;background:linear-gradient(145deg,#07131d,#0a1019)}
.growth-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.growth-head strong{color:#8eeaff;font-size:12px;letter-spacing:.06em}.growth-head span{font-size:11px;color:#a9b8c8}
.growth p{margin:7px 0 0;font-size:11px;color:#a8b3ca;line-height:1.45}
.growth-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.growth-actions button{font-size:10px;padding:10px 7px}
@media(max-width:700px){.growth-actions{grid-template-columns:1fr}}
@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="nav">
<a class="back" href="record_music.html">← RECORDING BOOTH</a>
<a class="back" href="music_city_feed.html">📱 CITY FEED</a>
<a class="back" href="manager.html">🧑‍💼 MANAGER</a>
<a class="back" href="sync_cinema.html">🎬 SYNC CINEMA</a>
<a class="back" href="music_city_locker.html">🔐 LOCKER</a>
</div>
<h1>MUSIC CITY ESTATES</h1>
</header>

<div class="wrap">
<section class="hero">
<h2>💿 Artist Catalog</h2>
<p>Save tracks, release them into Music City, promote them, and let your manager submit them for radio or film and TV sync opportunities.</p>
<div class="stats">
<div class="pill">Songs: <strong id="songCount">0</strong></div>
<div class="pill">Fans: <strong id="fanCount">0</strong></div>
<div class="pill">XP: <strong id="xpCount">0</strong></div>
<div class="pill">Cash: $<strong id="cashCount">0</strong></div>
<div class="pill">Career: <strong id="careerTitle">Bedroom Artist</strong></div>
</div>
<div id="notice" class="notice"></div>
</section>

<div id="catalog"></div>
</div>

<script src="player-state.js"></script>
<script src="music_city_missions.js"></script>
<script src="music_city_catalog.js"></script>
<script src="music_city_assets.js"></script>
<script>
let objectUrls = [];

function showNotice(message) {
  const notice = document.getElementById("notice");
  notice.textContent = message;
  notice.style.display = "block";
}

function releaseById(id) {
  try {
    const before = window.MCE.get();
    const release = before.releases.find(item => String(item.id) === String(id)) || {};
    const craft = window.MCE.getSongCraftImpact(release);
    window.MCE.releaseSong(id);
    showNotice(
      "Song released. Base +3 fans / +5 XP" +
      (craft.releaseFans || craft.releaseXp
        ? " • Craft bonus +" + craft.releaseFans + " fans / +" + craft.releaseXp + " XP"
        : "") +
      ". It is now visible in the Music City Feed."
    );
    renderCatalog();
  } catch (error) {
    showNotice(error.message || "Could not release this song.");
  }
}

function promoteById(id) {
  try {
    window.MCE.promoteRelease(id);
    const manager = window.MCE.getManagerProfile();
    showNotice(
      manager.name + " completed the campaign. -$" +
      manager.promotionFee +
      " • +" + manager.promotionFans +
      " fans • +" + manager.promotionXp + " XP."
    );
    renderCatalog();
  } catch (error) {
    showNotice(error.message || "Could not promote this song.");
  }
}

function submitRadioById(id) {
  try {
    window.MCE.submitReleaseToRadio(id);
    const manager = window.MCE.getManagerProfile();
    showNotice(
      manager.name + " submitted the track to Music City Radio. -$" +
      manager.radioFee +
      " • Radio influence +" + manager.radioInfluence +
      ". Submission pays for consideration only and does not guarantee airplay."
    );
    renderCatalog();
  } catch (error) {
    showNotice(error.message || "Could not submit this song to radio.");
  }
}


function fallbackCopyInvite(text) {
  const box = document.createElement("textarea");
  box.value = text;
  box.setAttribute("readonly", "");
  box.style.position = "fixed";
  box.style.opacity = "0";
  document.body.appendChild(box);
  box.select();
  box.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (error) {}
  box.remove();
  return ok;
}

async function inviteFriendById(id, title) {
  try {
    const before = window.MCE.getStreetTeamStatus(id);
    if (before.remaining <= 0) {
      showNotice("You already earned all 10 Street Team invite rewards for this song.");
      return;
    }

    const inviteUrl = new URL("index.html", window.location.href).href;
    const artist = window.MCE.get().name || "an artist";
    const inviteText =
      artist + ' just made "' + (title || "a new song") +
      '" in Music City Estates. Come check out the music career world: ' + inviteUrl;

    let completed = false;
    if (navigator.share) {
      try {
        await navigator.share({
          title: "Music City Estates",
          text: inviteText,
          url: inviteUrl
        });
        completed = true;
      } catch (error) {
        if (error && error.name === "AbortError") {
          showNotice("Invite canceled. No XP was used or awarded.");
          return;
        }
      }
    }

    if (!completed) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(inviteText);
          completed = true;
        }
      } catch (error) {}
    }

    if (!completed) completed = fallbackCopyInvite(inviteText);
    if (!completed) throw new Error("Could not open or copy the invite on this device.");

    const after = window.MCE.claimStreetTeamInvite(id);
    const status = window.MCE.getStreetTeamStatus(id, after);
    showNotice(
      "Street Team invite counted: +5 XP. " +
      status.count + "/10 rewarded invites used for this song. " +
      status.remaining + " remain."
    );
    renderCatalog();
  } catch (error) {
    showNotice(error.message || "Could not count that Street Team invite.");
  }
}

function claimHustleById(id, hustleId) {
  try {
    const hustle = window.MCE.CAREER_HUSTLES[hustleId];
    window.MCE.claimCareerHustle(id, hustleId);
    showNotice(
      hustle.label + " complete: +" + hustle.xp + " XP" +
      (hustle.cash ? " • +$" + hustle.cash : "") + "."
    );
    renderCatalog();
  } catch (error) {
    showNotice(error.message || "Could not complete that career hustle.");
  }
}

async function renderCatalog() {
  objectUrls.forEach(url => URL.revokeObjectURL(url));
  objectUrls = [];

  const state = window.MCE.get();
  document.getElementById("songCount").textContent = state.songs;
  document.getElementById("fanCount").textContent = state.fans;
  document.getElementById("xpCount").textContent = state.xp;
  document.getElementById("cashCount").textContent = state.cash;
  document.getElementById("careerTitle").textContent = window.MCE.getCareerTitle(state);

  const releaseMap = {};
  state.releases.forEach(release => {
    releaseMap[String(release.id)] = release;
  });

  const catalog = document.getElementById("catalog");
  const tracks = await window.MusicCityCatalog.listTracks();
  const certificates = await window.MusicCityAssets.listCertificates();
  const certificateMap = {};
  certificates.forEach(certificate => {
    certificateMap[String(certificate.trackId)] = certificate;
  });

  if (!tracks.length) {
    catalog.innerHTML =
      '<div class="empty">No saved AI tracks yet. Create one in the Recording Booth, then choose <strong>Save to Artist Catalog</strong>.</div>';
    return;
  }

  catalog.innerHTML = "";

  tracks.forEach(track => {
    const release = releaseMap[String(track.id)] || {};
    const isReleased = release.releaseStatus === "released";
    const isPromoted = Number(release.promotionCount || 0) > 0;
    const radioSubmitted = release.radioStatus === "submitted";
    const radioUnlocked = window.MCE.isUnlocked("radio", state);
    const radioGap = window.MCE.needed(window.MCE.UNLOCKS.radio, state);
    const hasManager = window.MCE.hasManager(state);
    const manager = window.MCE.getManagerProfile(state);
    const economy = window.MCE.ECONOMY;
    const promotionFee = manager ? manager.promotionFee : economy.managedPromotionFee;
    const radioFee = manager ? manager.radioFee : economy.radioSubmissionFee;
    const promotionFans = manager ? manager.promotionFans : 0;
    const promotionXp = manager ? manager.promotionXp : 0;
    const canAffordPromotion = state.cash >= promotionFee;
    const canAffordRadio = state.cash >= radioFee;
    const craftImpact = window.MCE.getSongCraftImpact(release);
    const craftScore = Number(release.craftScore || track.craftScore || 0);
    const craftTier = release.craftTier || track.craftTier || "Quick Draft";
    const certificate = certificateMap[String(track.id)] || null;
    const hasPassport =
      Boolean(certificate) ||
      release.certificationStatus === "passport-ready" ||
      release.certificationStatus === "certified";
    const isMainnetCertified =
      Boolean(
        certificate &&
        certificate.chain.status === "minted" &&
        String(certificate.chain.network || "").toLowerCase() === "mainnet"
      ) ||
      release.certificationStatus === "certified";
    const isTestnetCertified =
      Boolean(
        certificate &&
        certificate.chain.status === "minted" &&
        String(certificate.chain.network || "").toLowerCase() !== "mainnet"
      ) ||
      release.certificationStatus === "certified-testnet";
    const isCertified = isMainnetCertified || isTestnetCertified;

    const card = document.createElement("article");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = track.title || "Untitled Song";
    card.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent =
      [track.style, track.beat, track.studio]
        .filter(Boolean)
        .join(" • ");
    card.appendChild(meta);

    const badges = document.createElement("div");
    badges.className = "badges";

    const provider = document.createElement("span");
    provider.className = "badge";
    provider.textContent = track.provider || "Music City AI";
    badges.appendChild(provider);

    const status = document.createElement("span");
    status.className = "badge" + (isReleased ? " live" : "");
    status.textContent = isReleased ? "RELEASED" : "UNRELEASED";
    badges.appendChild(status);

    const craftBadge = document.createElement("span");
    craftBadge.className = "badge craft";
    craftBadge.textContent =
      "CRAFT " + craftScore + " • " + String(craftTier).toUpperCase();
    badges.appendChild(craftBadge);

    if (hasPassport) {
      const certified = document.createElement("span");
      certified.className = "badge certified";
      certified.textContent = isMainnetCertified
        ? "✓ MUSIC CITY CERTIFIED • MAINNET"
        : isTestnetCertified
          ? "✓ MUSIC CITY TESTNET CERTIFIED"
          : "RECORD PASSPORT READY • NOT CERTIFIED";
      badges.appendChild(certified);
    }

    if (radioSubmitted) {
      const radio = document.createElement("span");
      radio.className = "badge radio";
      radio.textContent = "RADIO SUBMITTED";
      badges.appendChild(radio);
    }

    card.appendChild(badges);

    const craftSummary = document.createElement("div");
    craftSummary.className = "craft-summary";
    craftSummary.textContent =
      "A&R Craft: " + craftScore + "/100 • " + craftTier +
      " • " + Number(release.revisionCount || track.revisionCount || 0) +
      " revision pass" +
      (Number(release.revisionCount || track.revisionCount || 0) === 1 ? "" : "es") +
      " • Release bonus +" + craftImpact.releaseFans + " fans / +" +
      craftImpact.releaseXp + " XP • Promo bonus +" +
      craftImpact.promotionFans + " fans / +" +
      craftImpact.promotionXp + " XP • Radio craft influence +" +
      craftImpact.radioInfluence + ".";
    card.appendChild(craftSummary);

    if (track.audioBlob) {
      const audio = document.createElement("audio");
      audio.controls = true;
      const url = URL.createObjectURL(track.audioBlob);
      objectUrls.push(url);
      audio.src = url;
      card.appendChild(audio);
    }

    const streetTeam = release.id
      ? window.MCE.getStreetTeamStatus(track.id, state)
      : { count:0, max:10, remaining:10, earnedXp:0 };
    const hustles = release.id
      ? window.MCE.getCareerHustleStatus(track.id, state)
      : { rehearsal:false, streetPromo:false };

    const growth = document.createElement("section");
    growth.className = "growth";
    growth.innerHTML =
      '<div class="growth-head"><strong>📣 STREET TEAM + CAREER HUSTLES</strong><span>' +
      streetTeam.count + '/10 INVITES • +' + streetTeam.earnedXp + ' XP EARNED</span></div>' +
      '<p>Invite people into Music City after making your song. Each completed share/copy earns +5 XP, up to 10 rewarded invites per song. Your friend does not have to accept or join for the invite XP to count.</p>';

    const growthActions = document.createElement("div");
    growthActions.className = "growth-actions";

    const inviteButton = document.createElement("button");
    inviteButton.textContent = streetTeam.remaining > 0
      ? "📨 INVITE FRIEND +5 XP (" + streetTeam.remaining + " LEFT)"
      : "✓ 10 INVITE REWARDS COMPLETE";
    inviteButton.disabled = !release.id || streetTeam.remaining <= 0;
    inviteButton.onclick = () => inviteFriendById(track.id, track.title);
    growthActions.appendChild(inviteButton);

    const rehearseButton = document.createElement("button");
    rehearseButton.textContent = hustles.rehearsal ? "✓ REHEARSAL COMPLETE" : "🎤 REHEARSE +2 XP";
    rehearseButton.disabled = !release.id || hustles.rehearsal;
    rehearseButton.onclick = () => claimHustleById(track.id, "rehearsal");
    growthActions.appendChild(rehearseButton);

    const streetPromoButton = document.createElement("button");
    streetPromoButton.textContent = hustles.streetPromo ? "✓ STREET PROMO COMPLETE" : "🗣 STREET PROMO +2 XP / +$10";
    streetPromoButton.disabled = !release.id || hustles.streetPromo;
    streetPromoButton.onclick = () => claimHustleById(track.id, "street-promo");
    growthActions.appendChild(streetPromoButton);

    growth.appendChild(growthActions);
    card.appendChild(growth);

    const actions = document.createElement("div");
    actions.className = "actions";

    const releaseButton = document.createElement("button");
    releaseButton.className = "primary";
    releaseButton.textContent = isReleased ? "✓ RELEASED" : "🚀 RELEASE SONG";
    releaseButton.disabled = isReleased;
    releaseButton.onclick = () => releaseById(track.id);
    actions.appendChild(releaseButton);

    const promoteButton = document.createElement("button");
    promoteButton.textContent = isPromoted
      ? "✓ PROMOTED"
      : !hasManager
        ? "🧑‍💼 HIRE MANAGER"
        : canAffordPromotion
          ? "📣 " + manager.name.toUpperCase() + " PROMOTE — $" + promotionFee
          : "🔒 PROMO NEED $" + promotionFee;
    promoteButton.disabled =
      !isReleased ||
      isPromoted ||
      (hasManager && !canAffordPromotion);
    promoteButton.onclick = () => {
      if (!hasManager) {
        window.location.href = "manager.html";
        return;
      }
      promoteById(track.id);
    };
    actions.appendChild(promoteButton);

    const radioButton = document.createElement("button");
    radioButton.textContent = radioSubmitted
      ? "✓ RADIO SUBMITTED"
      : !hasManager
        ? "🧑‍💼 HIRE MANAGER"
        : !radioUnlocked
          ? "🔒 RADIO LOCKED"
          : !canAffordRadio
            ? "🔒 RADIO NEED $" + radioFee
            : "📻 " + manager.name.toUpperCase() + " SUBMIT — $" + radioFee;
    radioButton.disabled =
      !isReleased ||
      radioSubmitted ||
      (hasManager && (!radioUnlocked || !canAffordRadio));
    radioButton.onclick = () => {
      if (!hasManager) {
        window.location.href = "manager.html";
        return;
      }
      submitRadioById(track.id);
    };
    actions.appendChild(radioButton);

    const feedButton = document.createElement("button");
    feedButton.textContent = "📱 VIEW FEED";
    feedButton.disabled = !isReleased;
    feedButton.onclick = () => {
      window.location.href = "music_city_feed.html";
    };
    actions.appendChild(feedButton);

    const certifyButton = document.createElement("button");
    certifyButton.textContent = isCertified
      ? "🔐 VIEW CERTIFIED ASSET"
      : hasPassport
        ? "🪪 VIEW RECORD PASSPORT"
        : "🪪 PREPARE RECORD PASSPORT";
    certifyButton.disabled = !track.audioBlob;
    certifyButton.onclick = () => {
      window.location.href = hasPassport
        ? "music_city_locker.html"
        : "certify_record.html?id=" + encodeURIComponent(track.id);
    };
    actions.appendChild(certifyButton);

    card.appendChild(actions);

    const reward = document.createElement("div");
    reward.className = "reward";
    reward.textContent = !isReleased
      ? "Release reward: +3 fans, +5 XP • Record Passport preparation is separate from release quality. Music City Certification happens only after the finalized passport is minted on-chain."
      : !hasManager
        ? "Professional promotion and radio require a manager. Starter management begins at $" + economy.managerHiringFee + "."
        : !isPromoted
          ? manager.name + " promotion: $" + promotionFee +
            " • manager reward +" + promotionFans + " fans, +" + promotionXp +
            " XP • craft bonus +" + craftImpact.promotionFans + " fans, +" +
            craftImpact.promotionXp + " XP."
          : radioSubmitted
            ? "Radio submission handled by " + (release.radioManager || manager.name) +
              " • fee paid $" + (release.radioFeePaid || radioFee) +
              " • influence +" + (release.radioInfluence || manager.radioInfluence) +
              " • pending consideration."
            : radioUnlocked
              ? manager.name + " radio submission: $" + radioFee +
                " • manager influence +" + manager.radioInfluence +
                " • song craft influence +" + craftImpact.radioInfluence + "."
              : "Radio unlock: " + radioGap.fans + " more fans and " + radioGap.xp + " more XP.";
    card.appendChild(reward);

    catalog.appendChild(card);
  });
}

renderCatalog().catch(error => {
  document.getElementById("catalog").innerHTML =
    '<div class="empty">' + (error.message || "Could not load catalog.") + '</div>';
});
</script>
</body>
</html>
