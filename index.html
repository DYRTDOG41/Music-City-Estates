<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enter Music City | Music City Estates</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 0, 170, .22), transparent 34%),
        radial-gradient(circle at 80% 75%, rgba(0, 230, 255, .18), transparent 32%),
        #090b18;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 24px;
    }
    main { width: min(760px, 100%); }
    .eyebrow {
      margin: 0 0 14px;
      letter-spacing: .28em;
      text-transform: uppercase;
      font-size: .78rem;
      color: #7cf3ff;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 7rem);
      line-height: .95;
      text-transform: uppercase;
    }
    p {
      max-width: 580px;
      margin: 24px auto 34px;
      color: #c9cbe0;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 16px 30px;
      border: 2px solid #7cf3ff;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(124, 243, 255, .18);
    }
    a:focus, a:hover { background: rgba(124, 243, 255, .12); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Music City Estates</p>
    <h1>Enter Music City</h1>
    <p>Step into the city, explore the districts, build your artist career, and make your name.</p>
    <a href="city_map.html">Enter Music City</a>
  </main>
</body>
</html>
