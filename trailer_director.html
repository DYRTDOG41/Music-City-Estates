<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trailer Mode | Music City Estates</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#020712;color:#fff}body{background:radial-gradient(circle at 18% 18%,#07345c 0,transparent 28%),radial-gradient(circle at 82% 30%,#3d0b5a 0,transparent 25%),linear-gradient(145deg,#020712,#06020d 70%);overflow-x:hidden}.grain{position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}.wrap{position:relative;width:min(1120px,92%);margin:auto;padding:54px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:12px;font-weight:900;letter-spacing:.2em;color:#7de8ff}.exit{color:#fff;text-decoration:none;padding:9px 13px;border:1px solid #ffffff3d;border-radius:9px;background:#050916c9}.hero{min-height:56vh;display:flex;flex-direction:column;justify-content:center;max-width:900px}.kicker{font-size:12px;letter-spacing:.28em;font-weight:900;color:#67e2ff}.hero h1{font-size:clamp(52px,9vw,112px);line-height:.83;letter-spacing:-.06em;margin:17px 0;text-transform:uppercase}.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1px #a86cff;text-shadow:0 0 38px #8b39df61}.hero p{font-size:clamp(17px,2vw,24px);max-width:700px;line-height:1.5;color:#c4d3e5}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:17px}.button{display:inline-block;padding:15px 21px;border-radius:10px;text-decoration:none;font-weight:900;letter-spacing:.04em}.primary{background:#55ddff;color:#00121b;box-shadow:0 0 30px #28caf259}.secondary{border:1px solid #9669ff;color:#fff;background:#100a20}.route{border-top:1px solid #ffffff20;padding-top:25px}.route-head{display:flex;justify-content:space-between;align-items:end;gap:15px}.route h2{font-size:clamp(25px,4vw,42px);margin:0}.route-head p{color:#899db4;margin:0}.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:22px}.shot{min-height:170px;padding:17px;border:1px solid #24425e;border-radius:15px;background:linear-gradient(150deg,#071421db,#080713e8);text-decoration:none;color:#fff;transition:.2s;position:relative;overflow:hidden}.shot:hover{transform:translateY(-3px);border-color:#5cdbff;box-shadow:0 14px 35px #0008}.number{font-size:45px;font-weight:900;color:#ffffff10;position:absolute;right:13px;top:4px}.shot small{font-size:9px;letter-spacing:.16em;color:#67e2ff;font-weight:900}.shot h3{margin:31px 0 7px;font-size:19px}.shot p{font-size:12px;line-height:1.45;color:#9eb0c5;margin:0}.finale{min-height:78vh;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}.finale h1{font-size:clamp(48px,10vw,120px);line-height:.9;margin:12px 0;letter-spacing:-.06em}.finale .tag{font-size:clamp(18px,3vw,34px);letter-spacing:.12em;color:#6fe5ff}.finale .coming{margin-top:30px;color:#bf9aff;font-weight:900;letter-spacing:.2em}.finale .actions{justify-content:center}@media(max-width:800px){.wrap{padding-top:25px}.hero{min-height:62vh}.shots{grid-template-columns:1fr}.route-head{display:block}.route-head p{margin-top:8px}.shot{min-height:135px}}
</style>
</head>
<body><div class="grain"></div><main class="wrap" id="main"></main>
<script src="trailer_mode.js"></script>
<script>
const main=document.getElementById("main"),finale=new URLSearchParams(location.search).get("finale")==="1";
if(finale){main.innerHTML=`<section class="finale"><div class="kicker">THE JOURNEY IS YOURS</div><h1>MUSIC CITY<br>ESTATES</h1><div class="tag">CREATE. PERFORM. COLLABORATE. EARN.</div><div class="coming">THE NEXT GENERATION OF MUSIC CAREERS</div><div class="actions"><a class="button primary" href="${MCETrailer.buildUrl(0)}">REPLAY TRAILER ROUTE</a><a class="button secondary" href="city_map.html">ENTER THE CITY</a></div></section>`}else{main.innerHTML=`<div class="top"><div class="brand">MUSIC CITY ESTATES • DIRECTOR MODE</div><a class="exit" href="city_map.html">EXIT TO GAME</a></div><section class="hero"><div class="kicker">TRAILER-READY VERTICAL SLICE</div><h1>Build Your <span>Music Legacy</span></h1><p>Start unknown. Create original music. Enter studios and battles. Build fans. Earn radio consideration. Become a Music City superstar.</p><div class="actions"><a class="button primary" href="${MCETrailer.buildUrl(0)}">▶ BEGIN TRAILER ROUTE</a><a class="button secondary" href="#shotList">VIEW SHOT LIST</a></div></section><section class="route" id="shotList"><div class="route-head"><h2>Camera-ready route</h2><p>Seven playable chapters • 60–90 second target</p></div><div class="shots" id="shots"></div></section>`;const shots=document.getElementById("shots");MCETrailer.ROUTE.forEach((scene,index)=>{const card=document.createElement("a");card.className="shot";card.href=MCETrailer.buildUrl(index);card.innerHTML=`<span class="number">0${index+1}</span><small>${scene.eyebrow}</small><h3>${scene.title}</h3><p>${scene.note}</p>`;shots.appendChild(card)})}
</script></body></html>
