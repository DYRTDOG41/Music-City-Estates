<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Walkable Hip-Hop Heights music district in Music City Estates.">
<title>Hip-Hop Heights | Music City Estates</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090815;color:#fff;font-family:Arial,sans-serif}
button{font:inherit}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:20;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.plate{padding:9px 13px;border:1px solid #e6bd536e;border-radius:11px;background:#090815d9;box-shadow:0 0 24px #7d4ed537;backdrop-filter:blur(8px)}
.title{font-weight:900;letter-spacing:.08em}
.subtitle{font-size:10px;color:#ddcda9;margin-top:3px}
.stats{display:flex;gap:13px;font-size:13px}
.back{position:fixed;z-index:25;left:15px;bottom:15px;padding:9px 13px;border:1px solid #ffffff38;border-radius:18px;background:#090815d9;color:#fff;text-decoration:none;font-size:12px;font-weight:900;backdrop-filter:blur(8px)}
.interact{display:none;position:fixed;z-index:35;left:50%;bottom:74px;transform:translateX(-50%);padding:13px 20px;border:1px solid #f0c657;border-radius:12px;background:#0a0812ef;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 0 30px #d7a93342}
.interact.show{display:block}
.hint{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 13px;border:1px solid #ffffff26;border-radius:18px;background:#080711c7;font-size:10px;font-weight:800;white-space:nowrap;pointer-events:none;backdrop-filter:blur(7px)}
.touch{display:none;position:fixed;z-index:26;right:15px;bottom:15px;grid-template:repeat(2,44px)/repeat(3,44px);gap:4px}
.touch button{border:1px solid #ffffff66;background:#080711d9;color:#fff;border-radius:9px;font-size:18px}
.touch .up{grid-column:2}.touch .left{grid-row:2;grid-column:1}.touch .down{grid-row:2;grid-column:2}.touch .right{grid-row:2;grid-column:3}
.toast{display:none;position:fixed;z-index:50;left:50%;bottom:122px;transform:translateX(-50%);width:min(380px,90%);padding:13px 16px;border:1px solid #59dcff;border-radius:12px;background:#080711ed;text-align:center;font-size:13px;box-shadow:0 0 30px #000}
.toast.show{display:block}
@media(max-width:720px){
  .hud{left:8px;right:8px;top:8px}
  .plate{padding:7px 9px}
  .title{font-size:12px}.subtitle{font-size:8px}.stats{font-size:10px;gap:6px}
  .hint{bottom:110px;max-width:82%;white-space:normal;text-align:center}
  .touch{display:grid}
  .back{bottom:112px}
  .interact{bottom:164px;max-width:84%;text-align:center}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<div class="hud">
  <div class="plate"><div class="title">HIP-HOP HEIGHTS</div><div class="subtitle">WIDE 3D STREET DISTRICT • CLICKABLE STOREFRONTS</div></div>
  <div class="plate stats"><span>👥 <b id="fans">0</b></span><span>💵 $<b id="cash">100</b></span><span>⭐ <b id="xp">0</b></span></div>
</div>
<button class="interact" id="interactPrompt">E / TAP — ENTER BUILDING</button>
<a class="back" href="city_map.html">← MUSIC CITY</a>
<div class="hint" id="aimHint">DRAG TO LOOK • WALK TO A STOREFRONT • CLICK ITS DOOR</div>
<div class="touch">
  <button class="up" data-move="w" aria-label="Move forward">▲</button>
  <button class="left" data-move="a" aria-label="Move left">◀</button>
  <button class="down" data-move="s" aria-label="Move backward">▼</button>
  <button class="right" data-move="d" aria-label="Move right">▶</button>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="player-state.js"></script>
<script type="module" src="hip_hop_heights_3d.js"></script>
<script src="trailer_mode.js"></script>
</body>
</html>
