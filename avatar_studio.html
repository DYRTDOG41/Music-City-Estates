<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Avatar Room | Word Slaughter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050307;color:#fff;font-family:Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:20;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;pointer-events:none}.plate{background:#090611e8;border:1px solid #d24bff;border-radius:9px;padding:9px 13px;box-shadow:0 0 20px #8e20c766}.stats{display:flex;gap:13px}.interact{display:none;position:fixed;z-index:30;left:50%;bottom:76px;transform:translateX(-50%);padding:13px 20px;border:1px solid #ffcf36;border-radius:10px;background:#050306ef;color:#fff;font-weight:900;cursor:pointer}.interact.show{display:block}.back{position:fixed;z-index:25;left:15px;bottom:15px;padding:9px 13px;background:#09070ce8;border:1px solid #777;border-radius:7px;color:#fff;text-decoration:none}.hint{position:fixed;z-index:20;left:50%;bottom:20px;transform:translateX(-50%);font-size:11px;background:#0009;padding:7px 12px;border-radius:18px}.touch{display:none;position:fixed;z-index:26;right:15px;bottom:15px;grid-template:repeat(2,44px)/repeat(3,44px);gap:4px}.touch button{border:1px solid #ffffff66;background:#000a;color:#fff;border-radius:9px;font-size:18px}.touch .up{grid-column:2}.touch .left{grid-row:2;grid-column:1}.touch .down{grid-row:2;grid-column:2}.touch .right{grid-row:2;grid-column:3}.modal{display:none;position:fixed;z-index:100;inset:0;background:#000c;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.panel{width:min(620px,96%);max-height:90vh;overflow:auto;background:#100817;border:1px solid #d24bff;border-radius:16px;padding:22px;box-shadow:0 0 40px #9d21cd66}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:#e7caef}input,select{display:block;width:100%;margin-top:5px;padding:11px;background:#09050d;color:#fff;border:1px solid #664872;border-radius:8px}.swatches{display:flex;gap:8px;margin:8px 0 15px}.swatch{width:36px;height:36px;border:2px solid #fff5;border-radius:50%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions button{padding:13px;border:0;border-radius:8px;font-weight:900}.save{background:#ffcf36}.close{background:#482353;color:#fff}@media(max-width:720px){.hint{display:none}.touch{display:grid}.stats{font-size:10px;gap:6px}.grid{grid-template-columns:1fr}.hud{font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<div class="hud"><div class="plate"><strong>WORD SLAUGHTER</strong><br><small>3D Avatar Room</small></div><div class="plate stats"><span>👥 <b id="fans">0</b></span><span>💵 $<b id="cash">500</b></span><span>⭐ <b id="xp">0</b></span></div></div>
<button class="interact" id="interactPrompt">E / TAP — INTERACT</button>
<a class="back" href="warehouse.html">← Warehouse</a>
<div class="hint">WASD to walk • Drag to look • E to interact</div>
<div class="touch"><button class="up" data-move="w">▲</button><button class="left" data-move="a">◀</button><button class="down" data-move="s">▼</button><button class="right" data-move="d">▶</button></div>
<div class="modal" id="customizer"><div class="panel"><h2>🎭 Customize Your 3D Artist</h2><p>Your saved look follows you into the Battle Room and future landmarks.</p><div class="grid"><label>Stage name<input id="artistName" maxlength="24"></label><label>Artist type<select id="artistType"><option>Rapper</option><option>Singer</option><option>Producer</option><option>DJ</option><option>Songwriter</option></select></label><label>Hair style<select id="hairStyle"><option value="fade">Fade</option><option value="afro">Afro</option><option value="braids">Braids</option></select></label><label>Hair color<input id="hairColor" type="color" value="#171016"></label><label>Top color<input id="shirtColor" type="color" value="#7b2cff"></label><label>Pants color<input id="pantsColor" type="color" value="#171b2d"></label></div><p>Skin tone</p><div class="swatches"><button class="swatch" data-skin="#5a341f" style="background:#5a341f"></button><button class="swatch" data-skin="#7b472b" style="background:#7b472b"></button><button class="swatch" data-skin="#9a5f3c" style="background:#9a5f3c"></button><button class="swatch" data-skin="#c78962" style="background:#c78962"></button><button class="swatch" data-skin="#e0b08b" style="background:#e0b08b"></button></div><div class="actions"><button class="save" id="saveAvatar">SAVE 3D ARTIST</button><button class="close" id="closeCustomizer">RETURN TO ROOM</button></div><p id="notice"></p></div></div>
<script src="player-state.js"></script>
<script src="music_city_catalog.js"></script><script src="music_city_radio_player.js"></script>
<script type="module" src="avatar_studio_3d.js"></script>
</body>
</html>
