<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="description" content="Walkable 3D lobby for the Word Slaughter Warehouse in Hip-Hop Heights.">
<title>Word Slaughter Warehouse Lobby | Music City Estates</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font-family:Arial,Helvetica,sans-serif}button,a{font:inherit}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:20;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}.plate{padding:9px 13px;border:1px solid #ff435c;border-radius:11px;background:#050910df;box-shadow:0 0 25px #ff244840;backdrop-filter:blur(9px)}.title{font-weight:900;letter-spacing:.055em}.subtitle{margin-top:3px;color:#cdd8e2;font-size:9px;letter-spacing:.08em}.stats{display:flex;gap:13px;font-size:12px;border-color:#5fc8ff;box-shadow:0 0 25px #168cff3b}.zone{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:12px;background:linear-gradient(90deg,#ad162f,#6834a7);font-size:8px;font-weight:900;letter-spacing:.08em}
.interact{display:none;position:fixed;z-index:35;left:50%;bottom:78px;transform:translateX(-50%);max-width:88%;padding:13px 20px;border:1px solid #fff;border-radius:11px;background:#060a11f2;color:#fff;font-weight:900;text-align:center;cursor:pointer;box-shadow:0 0 28px #ffffff2d}.interact.show{display:block}.back{position:fixed;z-index:25;left:15px;bottom:max(15px,env(safe-area-inset-bottom));padding:9px 13px;border:1px solid #ffffff38;border-radius:9px;background:#05080de5;color:#fff;text-decoration:none;font-size:11px;font-weight:900;backdrop-filter:blur(8px)}.hint{position:fixed;z-index:20;left:50%;bottom:21px;transform:translateX(-50%);padding:7px 12px;border-radius:18px;background:#02040ac9;color:#e5e8ec;font-size:10px;white-space:nowrap;pointer-events:none}.touch{display:none;position:fixed;z-index:26;right:15px;bottom:max(15px,env(safe-area-inset-bottom));grid-template:repeat(2,44px)/repeat(3,44px);gap:4px}.touch button{border:1px solid #ffffff61;background:#05080de3;color:#fff;border-radius:9px;font-size:18px}.touch .up{grid-column:2}.touch .left{grid-row:2;grid-column:1}.touch .down{grid-row:2;grid-column:2}.touch .right{grid-row:2;grid-column:3}
.toast{display:none;position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(410px,88%);padding:18px;border:1px solid #ff4c64;border-radius:14px;background:#060910f2;text-align:center;box-shadow:0 20px 60px #000}.toast.show{display:block}.toast strong{display:block;margin-bottom:7px;color:#ff7184}.toast span{color:#d5dde5;font-size:12px;line-height:1.45}
@media(max-width:720px){.hud{left:8px;right:8px;top:max(8px,env(safe-area-inset-top))}.plate{padding:7px 8px}.title{font-size:11px}.subtitle{display:none}.stats{gap:6px;font-size:9px}.hint{bottom:112px;max-width:76%;white-space:normal;text-align:center}.touch{display:grid}.back{bottom:112px}.interact{bottom:165px}.zone{font-size:7px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<div class="hud">
  <div class="plate"><div class="title">WORD SLAUGHTER WAREHOUSE</div><div class="subtitle">3D INDUSTRIAL LOBBY • CHOOSE YOUR DESTINATION</div><span class="zone">BATTLES • COMMUNITY • MERCH</span></div>
  <div class="plate stats"><span>👥 <b id="fans">0</b></span><span>💵 $<b id="cash">100</b></span><span>⭐ <b id="xp">0</b></span><span>🎤 <b id="level">1</b></span></div>
</div>
<button class="interact" id="interactPrompt">E / TAP — ENTER</button>
<a class="back" href="hip_hop_heights.html">← HIP-HOP HEIGHTS</a>
<div class="hint">WALK TO AN ENTRANCE • DRAG TO LOOK • TAP ENTER</div>
<div class="touch"><button class="up" data-move="w" aria-label="Move forward">▲</button><button class="left" data-move="a" aria-label="Move left">◀</button><button class="down" data-move="s" aria-label="Move backward">▼</button><button class="right" data-move="d" aria-label="Move right">▶</button></div>
<div class="toast" id="toast" role="status"><strong id="toastTitle"></strong><span id="toastMessage"></span></div>
<script src="player-state.js"></script>
<script type="module" src="warehouse_lobby_3d.js"></script>
</body>
</html>
